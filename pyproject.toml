[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sidinspector"
version = "1.0.0"
description = "Mapping-first diagnostics for semantic-ID tokenizer artifacts"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
  {name = "Jiandong Ding"},
  {name = "Heng Chang"},
  {name = "Huijie Qin"},
  {name = "Tianying Liu"},
]
keywords = [
  "semantic-id",
  "generative recommendation",
  "recommender systems",
  "diagnostics",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "scikit-learn>=1.3",
]

[project.urls]
Homepage = "https://github.com/jdding/sidinspector"
Repository = "https://github.com/jdding/sidinspector"

[tool.setuptools.packages.find]
where = ["src"]
